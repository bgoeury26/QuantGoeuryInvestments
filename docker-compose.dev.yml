services:
  postgres:
    image: postgres:15
    container_name: qgi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
      POSTGRES_DB: quant_db
    ports:
      - "5432:5432"
    volumes:
      - qgi_pg_data:/var/lib/postgresql/data

volumes:
  qgi_pg_data:
